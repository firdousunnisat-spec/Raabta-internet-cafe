<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RAABTA INTERNET CAFE</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
scroll-behavior:smooth;
}

body{
font-family:'Poppins',sans-serif;
background:#050505;
color:white;
overflow-x:hidden;
}

/* HERO */

.hero{
height:100vh;
background:
linear-gradient(rgba(0,0,0,.75),
rgba(0,0,0,.75)),
url('poster.jpg');

background-size:cover;
background-position:center;

display:flex;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
}

.hero-content h1{
font-size:80px;
font-family:'Cinzel',serif;
color:gold;
text-shadow:0 0 20px gold;
}

.hero-content h2{
font-size:35px;
letter-spacing:5px;
margin-bottom:15px;
}

.hero-content p{
font-size:20px;
margin-bottom:30px;
}

.btn{
background:gold;
color:black;
padding:15px 35px;
border-radius:50px;
text-decoration:none;
font-weight:bold;
}

/* SERVICES */

.services{
padding:80px 20px;
}

.title{
text-align:center;
font-size:45px;
color:gold;
margin-bottom:40px;
font-family:'Cinzel',serif;
}

.slider{
display:flex;
overflow-x:auto;
gap:25px;
padding:20px;
scroll-snap-type:x mandatory;
}

.slider::-webkit-scrollbar{
display:none;
}

.card{
min-width:320px;
height:240px;

background:
linear-gradient(
145deg,
#081220,
#15294d
);

border:2px solid gold;
border-radius:25px;

padding:25px;

scroll-snap-align:center;

box-shadow:
0 0 20px rgba(255,215,0,.3);

transition:.4s;
}

.card:hover{
transform:translateY(-10px);
}

.card h3{
color:gold;
font-size:26px;
margin-bottom:15px;
}

.card p{
font-size:18px;
line-height:1.6;
}

/* FEATURES */

.features{
padding:80px 20px;
background:#0d1222;
}

.feature-box{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.feature{
background:#111a30;
padding:25px;
border-radius:20px;
text-align:center;
border:1px solid gold;
}

.feature h3{
color:gold;
margin-bottom:10px;
}

/* CONTACT */

.contact{
padding:80px 20px;
text-align:center;
}

.contact-box{
max-width:700px;
margin:auto;
background:#111a30;
padding:35px;
border-radius:25px;
border:2px solid gold;
}

.contact-box h3{
color:gold;
margin-bottom:10px;
}

.contact-btn{
display:inline-block;
margin:10px;
padding:15px 25px;
background:gold;
color:black;
font-weight:bold;
text-decoration:none;
border-radius:50px;
}

/* FOOTER */

footer{
background:black;
padding:25px;
text-align:center;
}

/* WHATSAPP */

.whatsapp{
position:fixed;
right:20px;
bottom:20px;

width:65px;
height:65px;

background:#25D366;
border-radius:50%;

display:flex;
justify-content:center;
align-items:center;

font-size:30px;
text-decoration:none;

box-shadow:0 0 15px rgba(0,0,0,.5);
}

/* MOBILE */

@media(max-width:768px){

.hero-content h1{
font-size:50px;
}

.hero-content h2{
font-size:24px;
}

.title{
font-size:32px;
}

.card{
min-width:280px;
}

}

</style>
</head>

<body>

<section class="hero">

<div class="hero-content">

<h1>RAABTA</h1>

<h2>INTERNET CAFE</h2>

<p>Raabta Hai Toh Mumkin Hai</p>

<a href="#services" class="btn">
Explore Services
</a>

</div>

</section>
